<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flat 3D Regression Plane (-2 to 2 Scale)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Plotly.js for 3D Surface & Scatter Rendering -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Header -->
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold text-white">Flat 3D Regression Plane (Uniform Axis Scales)</h1>
      <p class="text-slate-400 text-sm mt-1">
        Model equation: <span class="font-mono text-indigo-300">Y = β₁·X₁ + β₂·X₂ + ε</span>. 
        All three variables ($X_1, X_2, Y$) are plotted on an identical <span class="font-mono text-amber-400">[-2, 2]</span> scale.
      </p>
    </header>

    <!-- Controls Panel -->
    <div class="bg-slate-800/60 rounded-xl border border-slate-800 p-5 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Beta 1 Slider -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label for="beta1-slider" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">X₁ Slope (β₁)</label>
            <span id="beta1-val" class="font-mono text-sm font-bold text-sky-400">0.50</span>
          </div>
          <input type="range" id="beta1-slider" min="-1.5" max="1.5" step="0.05" value="0.50" 
                 class="w-full accent-sky-500 bg-slate-700 h-2 rounded-lg cursor-pointer">
        </div>

        <!-- Beta 2 Slider -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label for="beta2-slider" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">X₂ Slope (β₂)</label>
            <span id="beta2-val" class="font-mono text-sm font-bold text-emerald-400">0.30</span>
          </div>
          <input type="range" id="beta2-slider" min="-1.5" max="1.5" step="0.05" value="0.30" 
                 class="w-full accent-emerald-500 bg-slate-700 h-2 rounded-lg cursor-pointer">
        </div>

      </div>

      <!-- Resample Data Button -->
      <div class="pt-3 border-t border-slate-700/50 flex justify-between items-center">
        <span class="text-xs text-slate-500">N = 150 observations clipped to [-2, 2] boundary</span>
        <button id="btn-resample" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium underline underline-offset-4">
          Resample Data Points
        </button>
      </div>
    </div>

    <!-- 3D Plot Area -->
    <div class="bg-slate-800/40 rounded-xl border border-slate-800 p-2 flex justify-center items-center">
      <div id="plot3d" class="w-full h-[580px]"></div>
    </div>
  </div>

  <script>
    // State Variables
    let b1 = 0.50, b2 = 0.30;
    const N = 150;
    const resolution = 25; // Surface mesh resolution

    // Standard Normal Generator (Box-Muller)
    function randomNormal() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    // Clamp values strictly to [-2, 2]
    function clamp(val, min = -2, max = 2) {
      return Math.min(Math.max(val, min), max);
    }

    // Generate Scatter Sample Points
    function generateScatterData(beta1, beta2, count) {
      const x1 = [], x2 = [], y = [];
      for (let i = 0; i < count; i++) {
        const x1Val = clamp(randomNormal() * 0.8);
        const x2Val = clamp(randomNormal() * 0.8);
        const noise = randomNormal() * 0.15;
        const yVal = clamp((beta1 * x1Val) + (beta2 * x2Val) + noise);
        
        x1.push(x1Val);
        x2.push(x2Val);
        y.push(yVal);
      }
      return { x1, x2, y };
    }

    // Generate Flat Surface Mesh across [-2, 2]
    function generateFlatSurfaceMesh(beta1, beta2) {
      const step = 4 / (resolution - 1); // Domain length = 4 (-2 to 2)
      const x1Grid = [], x2Grid = [], zGrid = [];

      for (let i = 0; i < resolution; i++) {
        x1Grid.push(-2 + i * step);
        x2Grid.push(-2 + i * step);
      }

      for (let i = 0; i < resolution; i++) {
        const row = [];
        const x2Val = x2Grid[i];
        for (let j = 0; j < resolution; j++) {
          const x1Val = x1Grid[j];
          const zVal = clamp((beta1 * x1Val) + (beta2 * x2Val));
          row.push(zVal);
        }
        zGrid.push(row);
      }

      return { x1Grid, x2Grid, zGrid };
    }

    let scatter = generateScatterData(b1, b2, N);

    // 3D Render
    function renderPlot3D() {
      const surface = generateFlatSurfaceMesh(b1, b2);

      // 1. Flat Surface Trace
      const surfaceTrace = {
        type: 'surface',
        x: surface.x1Grid,
        y: surface.x2Grid,
        z: surface.zGrid,
        colorscale: 'Viridis',
        opacity: 0.80,
        showscale: false,
        hoverinfo: 'x+y+z'
      };

      // 2. Scatter Points Trace
      const scatterTrace = {
        type: 'scatter3d',
        mode: 'markers',
        x: scatter.x1,
        y: scatter.x2,
        z: scatter.y,
        marker: {
          size: 4,
          color: '#ffffff',
          line: { color: '#6366f1', width: 1 },
          opacity: 0.9
        },
        hoverinfo: 'x+y+z'
      };

      const layout = {
        paper_bgcolor: 'transparent',
        plot_bgcolor: 'transparent',
        margin: { l: 0, r: 0, b: 0, t: 0 },
        scene: {
          aspectmode: 'cube', // Ensures equal visual proportions for all 3 axes
          xaxis: { title: 'X₁', range: [-2, 2], gridcolor: '#334155', zerolinecolor: '#94a3b8' },
          yaxis: { title: 'X₂', range: [-2, 2], gridcolor: '#334155', zerolinecolor: '#94a3b8' },
          zaxis: { title: 'Y', range: [-2, 2], gridcolor: '#334155', zerolinecolor: '#94a3b8' },
          camera: {
            eye: { x: 1.4, y: 1.4, z: 1.1 }
          }
        }
      };

      Plotly.react('plot3d', [surfaceTrace, scatterTrace], layout, { responsive: true, displayModeBar: false });
    }

    // UI Listeners
    const s1 = document.getElementById('beta1-slider');
    const s2 = document.getElementById('beta2-slider');

    const v1 = document.getElementById('beta1-val');
    const v2 = document.getElementById('beta2-val');

    function update() {
      b1 = parseFloat(s1.value);
      b2 = parseFloat(s2.value);

      v1.textContent = b1.toFixed(2);
      v2.textContent = b2.toFixed(2);

      renderPlot3D();
    }

    s1.addEventListener('input', update);
    s2.addEventListener('input', update);

    document.getElementById('btn-resample').addEventListener('click', () => {
      scatter = generateScatterData(b1, b2, N);
      renderPlot3D();
    });

    // Initial Execution
    renderPlot3D();
  </script>
</body>
</html>
