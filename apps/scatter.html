<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observable Plot - Interactive Scatter & Regression</title>

  <!-- Tailwind CSS for UI Layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- D3.js and Observable Plot CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold text-white">Interactive Bivariate Normal Scatter Plot</h1>
      <p class="text-slate-400 text-sm mt-1">
        Generated with Observable Plot. Adjust correlation strength and direction to update the distribution and regression line in real time.
      </p>
    </header>

    <!-- Controls Panel -->
    <div class="bg-slate-800/60 rounded-xl border border-slate-800 p-5 space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        
        <!-- Direction Toggle Buttons -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Relationship Direction</label>
          <div class="flex gap-3">
            <button id="btn-positive" class="flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
              Positive (+)
            </button>
            <button id="btn-negative" class="flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-all bg-slate-700 text-slate-300 hover:bg-slate-600">
              Negative (−)
            </button>
          </div>
        </div>

        <!-- Correlation Strength Slider -->
        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label for="strength-slider" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Strength of Association</label>
            <span id="correlation-val" class="font-mono text-sm font-bold text-indigo-400">r = 0.70</span>
          </div>
          <input type="range" id="strength-slider" min="0" max="0.99" step="0.01" value="0.70" 
                 class="w-full accent-indigo-500 bg-slate-700 h-2 rounded-lg cursor-pointer">
        </div>

      </div>

      <!-- Resample / Regenerate Button -->
      <div class="pt-2 border-t border-slate-700/50 flex justify-between items-center">
        <span class="text-xs text-slate-500">Sample Size: N = 250</span>
        <button id="btn-resample" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium underline underline-offset-4">
          Resample Data
        </button>
      </div>
    </div>

    <!-- Plot Container -->
    <div class="bg-slate-800/40 rounded-xl border border-slate-800 p-4 flex justify-center items-center">
      <div id="plot-container" class="w-full overflow-x-auto"></div>
    </div>
  </div>

  <script>
    // App State
    let sign = 1; // 1 for positive, -1 for negative
    let magnitude = 0.70;
    const N = 250;

    // Box-Muller transform for standard normal random variables
    function randomNormal() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    // Generate correlated bivariate normal data: Y = r*X + sqrt(1 - r^2)*Z
    function generateData(r, count) {
      const data = [];
      const absR = Math.min(Math.abs(r), 0.999);
      const noiseWeight = Math.sqrt(1 - absR * absR);

      for (let i = 0; i < count; i++) {
        const x = randomNormal();
        const z = randomNormal();
        const y = r * x + noiseWeight * z;
        data.push({ x, y });
      }
      return data;
    }

    let dataset = generateData(sign * magnitude, N);

    // Render function using Observable Plot
    function renderPlot() {
      const container = document.getElementById('plot-container');
      container.innerHTML = ''; // Clear previous render

      const targetR = sign * magnitude;

      const chart = Plot.plot({
        width: 760,
        height: 460,
        style: {
          background: "transparent",
          color: "#94a3b8"
        },
        grid: true,
        x: {
          label: "Variable X (Standard Normal)",
          domain: [-3.5, 3.5]
        },
        y: {
          label: "Variable Y (Standard Normal)",
          domain: [-3.5, 3.5]
        },
        marks: [
          // Zero axes
          Plot.ruleX([0], { stroke: "#475569", strokeDasharray: "4,4" }),
          Plot.ruleY([0], { stroke: "#475569", strokeDasharray: "4,4" }),
          
          // Scatter points
          Plot.dot(dataset, {
            x: "x",
            y: "y",
            fill: "#818cf8",
            fillOpacity: 0.6,
            r: 4.5,
            stroke: "#312e81",
            strokeWidth: 1
          }),

          // Linear Regression Trend Line via Observable Plot
          Plot.linearRegressionY(dataset, {
            x: "x",
            y: "y",
            stroke: sign > 0 ? "#38bdf8" : "#f43f5e",
            strokeWidth: 3
          }),

          // Dynamic Title text overlay inside canvas
          Plot.tip([`N = ${N} | Target r = ${targetR.toFixed(2)}`], {
            x: -3.2,
            y: 3.2,
            anchor: "top-left",
            fill: "#1e293b",
            stroke: "#475569"
          })
        ]
      });

      container.appendChild(chart);
    }

    // Controls Logic
    const slider = document.getElementById('strength-slider');
    const corrLabel = document.getElementById('correlation-val');
    const btnPos = document.getElementById('btn-positive');
    const btnNeg = document.getElementById('btn-negative');
    const btnResample = document.getElementById('btn-resample');

    function update() {
      magnitude = parseFloat(slider.value);
      const r = sign * magnitude;
      corrLabel.textContent = `r = ${r >= 0 ? '+' : ''}${r.toFixed(2)}`;
      dataset = generateData(r, N);
      renderPlot();
    }

    slider.addEventListener('input', update);

    btnPos.addEventListener('click', () => {
      sign = 1;
      btnPos.className = "flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
      btnNeg.className = "flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-all bg-slate-700 text-slate-300 hover:bg-slate-600";
      update();
    });

    btnNeg.addEventListener('click', () => {
      sign = -1;
      btnNeg.className = "flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-all bg-rose-600 text-white shadow-lg shadow-rose-600/30";
      btnPos.className = "flex-1 py-2 px-4 rounded-lg font-medium text-sm transition-all bg-slate-700 text-slate-300 hover:bg-slate-600";
      update();
    });

    btnResample.addEventListener('click', update);

    // Initial render
    renderPlot();
  </script>
</body>
</html>
