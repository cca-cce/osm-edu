<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correlated Random Variables - Observable Plot</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Include D3.js and Observable Plot via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-rose: #fb7185;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Controls Layout */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
      background: rgba(15, 23, 42, 0.6);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    @media (max-width: 640px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .value-badge {
      color: var(--accent-cyan);
      font-family: monospace;
      font-size: 1rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button.active {
      background: var(--accent-indigo);
      color: #fff;
      border-color: var(--accent-indigo);
      box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
    }

    /* Stats Display */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 24px;
      border: 1px solid var(--card-border);
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    /* Plot Container */
    #plot-container {
      width: 100%;
      display: flex;
      justify-content: center;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--card-border);
    }

    /* Override Plot styles for Dark Theme */
    #plot-container svg {
      background: transparent !important;
      color: var(--text-main) !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Normally Distributed Variable Correlation</h1>
      <p class="subtitle">Interactive scatter plot with dynamic trend line powered by Observable Plot</p>
    </header>

    <!-- Interactive Controls -->
    <div class="controls-grid">
      <!-- Slider: Strength of Association |r| -->
      <div class="control-group">
        <label for="strengthSlider">
          Correlation Strength (|r|): 
          <span class="value-badge" id="strengthVal">0.70</span>
        </label>
        <input type="range" id="strengthSlider" min="0" max="0.99" step="0.01" value="0.70">
      </div>

      <!-- Toggle: Positive vs Negative -->
      <div class="control-group">
        <label>Relationship Direction</label>
        <div class="btn-group">
          <button id="btnPositive" class="active" onclick="setDirection(1)">+ Positive</button>
          <button id="btnNegative" onclick="setDirection(-1)">- Negative</button>
        </div>
      </div>

      <!-- Sample Size Slider -->
      <div class="control-group">
        <label for="sampleSlider">
          Sample Size (N): 
          <span class="value-badge" id="sampleVal">300</span>
        </label>
        <input type="range" id="sampleSlider" min="50" max="1000" step="50" value="300">
      </div>

      <!-- Regenerate Seed -->
      <div class="control-group">
        <label>Resample Data</label>
        <button onclick="generateData()" style="height: 38px;">🎲 New Random Sample</button>
      </div>
    </div>

    <!-- Live Statistics Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">Target Correlation (r)</div>
        <div class="stat-val" id="targetR">+0.70</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Sample Correlation (r)</div>
        <div class="stat-val" id="sampleR">0.00</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Slope (β₁)</div>
        <div class="stat-val" id="slopeVal">0.00</div>
      </div>
    </div>

    <!-- Observable Plot Target -->
    <div id="plot-container"></div>
  </div>

  <script>
    // App State
    let targetStrength = 0.70;
    let direction = 1; // +1 or -1
    let sampleSize = 300;
    let rawZ1 = [];
    let rawZ2 = [];

    // Box-Muller transform for standard Normal RV generation N(0, 1)
    function randomNormal() {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    // Generate independent base standard normal vectors
    function generateData() {
      rawZ1 = Array.from({ length: sampleSize }, () => randomNormal());
      rawZ2 = Array.from({ length: sampleSize }, () => randomNormal());
      render();
    }

    function setDirection(dir) {
      direction = dir;
      document.getElementById('btnPositive').classList.toggle('active', dir === 1);
      document.getElementById('btnNegative').classList.toggle('active', dir === -1);
      render();
    }

    // Compute correlated variables X and Y using Cholesky Decomposition
    function getCorrelatedData() {
      const r = targetStrength * direction;
      const data = [];
      let sumX = 0, sumY = 0;

      for (let i = 0; i < sampleSize; i++) {
        const x = rawZ1[i];
        // Y = r*X + sqrt(1 - r^2)*Z2
        const y = r * x + Math.sqrt(1 - r * r) * rawZ2[i];
        data.push({ x, y });
        sumX += x;
        sumY += y;
      }

      // Calculate Pearson correlation & OLS regression slope for stats display
      const meanX = sumX / sampleSize;
      const meanY = sumY / sampleSize;
      let num = 0, denX = 0, denY = 0;

      for (let i = 0; i < sampleSize; i++) {
        const dx = data[i].x - meanX;
        const dy = data[i].y - meanY;
        num += dx * dy;
        denX += dx * dx;
        denY += dy * dy;
      }

      const sampleR = num / (Math.sqrt(denX) * Math.sqrt(denY));
      const slope = num / denX;

      return { data, targetR: r, sampleR, slope };
    }

    function render() {
      const { data, targetR, sampleR, slope } = getCorrelatedData();

      // Update statistics labels
      document.getElementById('targetR').textContent = (targetR >= 0 ? '+' : '') + targetR.toFixed(2);
      document.getElementById('sampleR').textContent = (sampleR >= 0 ? '+' : '') + sampleR.toFixed(2);
      document.getElementById('slopeVal').textContent = (slope >= 0 ? '+' : '') + slope.toFixed(2);

      // Color scheme according to correlation direction
      const pointColor = direction === 1 ? "#38bdf8" : "#fb7185";
      const trendColor = "#f59e0b";

      // Render Observable Plot
      const plot = Plot.plot({
        width: 800,
        height: 440,
        grid: true,
        style: {
          background: "transparent",
          color: "#94a3b8",
          fontSize: "12px"
        },
        x: {
          label: "Variable X ~ N(0, 1)",
          domain: [-3.5, 3.5]
        },
        y: {
          label: "Variable Y ~ N(0, 1)",
          domain: [-3.5, 3.5]
        },
        marks: [
          // Reference axes at origin
          Plot.ruleX([0], { stroke: "rgba(255, 255, 255, 0.15)", strokeWidth: 1 }),
          Plot.ruleY([0], { stroke: "rgba(255, 255, 255, 0.15)", strokeWidth: 1 }),

          // Scatter points
          Plot.dot(data, {
            x: "x",
            y: "y",
            r: 3,
            fill: pointColor,
            fillOpacity: 0.65,
            stroke: pointColor,
            strokeOpacity: 0.3
          }),

          // Fitted Trend Line (Linear Regression)
          Plot.linearRegressionY(data, {
            x: "x",
            y: "y",
            stroke: trendColor,
            strokeWidth: 2.5,
            ci: 0.95, // 95% Confidence Interval Band
            fill: trendColor,
            fillOpacity: 0.12
          })
        ]
      });

      const container = document.getElementById('plot-container');
      container.innerHTML = "";
      container.appendChild(plot);
    }

    // Event Listeners
    document.getElementById('strengthSlider').addEventListener('input', (e) => {
      targetStrength = parseFloat(e.target.value);
      document.getElementById('strengthVal').textContent = targetStrength.toFixed(2);
      render();
    });

    document.getElementById('sampleSlider').addEventListener('input', (e) => {
      sampleSize = parseInt(e.target.value, 10);
      document.getElementById('sampleVal').textContent = sampleSize;
      generateData();
    });

    // Initialize
    generateData();
  </script>
</body>
</html>
